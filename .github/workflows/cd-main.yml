name: CD Production

on:
  push:
    branches: [main]

concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release-and-deploy:
    name: Production Deployment & Tagging
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Tag
        id: tagger
        run: |
          VERSION="v$(date +'%Y.%m.%d-%H%M')"
          echo "RELEASE_TAG=$VERSION" >> $GITHUB_OUTPUT
          echo "Triggered deployment for release: $VERSION"

