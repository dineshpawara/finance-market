name: Frontend CI

on:
  # NOTE: paths filter is omitted on pull_request to prevent deadlock with GitHub required status checks.
  # Later, path filtering can be optimized using a single 'ci-gate' job with dorny/paths-filter.
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (if configured)
        run: npm test --if-present

      - name: Build production bundle
        run: npm run build
