version: 2
updates:
  # Maintain dependencies for GitHub Actions (Consolidated into 1 PR)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      actions-dependencies:
        patterns:
          - "*"

  # Maintain dependencies for React Frontend (Consolidated into 1 PR)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  # Maintain dependencies for FastAPI Backend (Consolidated into 1 PR)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      backend-dependencies:
        patterns:
          - "*"
