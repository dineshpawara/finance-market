[project]
name = "finance-backend"
version = "0.1.0"
description = "Indian Stock Market Finance API"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13.0",
    "fastapi[standard]>=0.141.1",
    "feedparser>=6.0.10",
    "psycopg2-binary>=2.9.13",
    "redis>=8.1.0",
    "requests>=2.28.0",
    "sqlalchemy>=2.0.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[tool.fastapi]
entrypoint = "main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E501"]
